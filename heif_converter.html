<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HEIF → JPG/PNG 변환기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c2024;
    --muted: #6b7280;
    --border: #d7dbe0;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --ok: #1a7f45;
    --err: #c0392b;
    --skip: #b7791f;
    --log-bg: #0f1720;
    --log-text: #d6e2f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --card: #1b2129;
      --text: #e6eaef;
      --muted: #9aa4b0;
      --border: #2c353f;
      --accent: #4f8bff;
      --log-bg: #0b0f14;
      --log-text: #cfe0f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label.field { font-weight: 600; min-width: 92px; }
  .path {
    flex: 1;
    min-width: 200px;
    font-size: 0.85rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-wrap: anywhere;
  }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 600;
    width: 100%;
    padding: 12px;
    font-size: 1rem;
  }
  .opts { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .opt { display: flex; align-items: center; gap: 6px; }
  input[type="range"] { vertical-align: middle; }
  progress { width: 100%; height: 14px; border-radius: 7px; }
  .log {
    background: var(--log-bg);
    color: var(--log-text);
    font-family: "SF Mono", "Consolas", "D2Coding", monospace;
    font-size: 0.82rem;
    border-radius: 8px;
    padding: 12px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .log .ok { color: #7ee2a8; }
  .log .err { color: #ff8b7a; }
  .log .skip { color: #ffce7a; }
  .notice {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.88rem;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .notice.warn { border-color: var(--skip); }
  .notice.error { border-color: var(--err); color: var(--err); }
  .hidden { display: none; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HEIF → JPG/PNG 변환기</h1>
  <p class="sub">아이폰 HEIC/HEIF 사진을 브라우저에서 바로 변환합니다. 설치 없이,
    파일은 인터넷으로 전송되지 않고 100% 내 컴퓨터에서만 처리됩니다.</p>

  <div id="fsNotice" class="notice hidden"></div>

  <!-- 폴더 → 폴더 모드 (Chrome / Edge) -->
  <div id="folderMode" class="hidden">
    <div class="card">
      <div class="row">
        <label class="field">입력 폴더</label>
        <span id="inPath" class="path">선택되지 않음</span>
        <button id="pickIn">폴더 선택…</button>
      </div>
      <div class="row">
        <label class="field">출력 폴더</label>
        <span id="outPath" class="path">선택되지 않음</span>
        <button id="pickOut">폴더 선택…</button>
      </div>
    </div>
  </div>

  <!-- 파일 선택 모드 (기타 브라우저) -->
  <div id="fileMode" class="hidden">
    <div class="card">
      <div class="row">
        <label class="field">파일/폴더</label>
        <input type="file" id="fileInput" accept=".heic,.heif,.hif,image/heic,image/heif" multiple />
      </div>
      <p class="sub" style="margin:0">이 브라우저는 폴더에 직접 저장하는 기능을 지원하지 않습니다.
        변환 결과는 아래 목록의 링크로 내려받을 수 있습니다.
        (폴더째 저장하려면 최신 Chrome 또는 Edge를 사용하세요.)</p>
    </div>
  </div>

  <div class="card">
    <div class="opts">
      <div class="opt">
        <strong>형식</strong>
        <label class="opt"><input type="radio" name="fmt" value="jpg" checked /> JPG</label>
        <label class="opt"><input type="radio" name="fmt" value="png" /> PNG</label>
      </div>
      <div class="opt">
        <strong>품질</strong>
        <input type="range" id="quality" min="1" max="100" value="90" />
        <span id="qVal">90</span>
      </div>
      <label class="opt" id="recWrap"><input type="checkbox" id="recursive" checked /> 하위 폴더 포함</label>
      <label class="opt"><input type="checkbox" id="overwrite" /> 기존 파일 덮어쓰기</label>
    </div>
  </div>

  <div class="card">
    <button id="convert" class="primary" disabled>변환 시작</button>
    <div style="height:12px"></div>
    <progress id="bar" value="0" max="1"></progress>
    <div style="height:12px"></div>
    <div id="log" class="log" aria-live="polite"></div>
    <div id="downloads" class="hidden" style="margin-top:12px"></div>
  </div>

  <p class="sub">HEIC 디코딩: <a href="https://github.com/alexcorvi/heic2any" target="_blank" rel="noopener">heic2any</a> (MIT).</p>
</div>

<script src="vendor/heic2any.min.js"></script>
<script>
(function () {
  "use strict";

  const HEIF_EXT = [".heic", ".heif", ".hif"];
  const hasFS = typeof window.showDirectoryPicker === "function";

  // --- DOM ---
  const $ = (id) => document.getElementById(id);
  const logEl = $("log");
  const barEl = $("bar");
  const convertBtn = $("convert");
  const downloadsEl = $("downloads");
  const fsNotice = $("fsNotice");

  // --- 상태 ---
  let inputHandle = null;   // FileSystemDirectoryHandle
  let outputHandle = null;  // FileSystemDirectoryHandle
  let fileList = [];        // File[] (fallback 모드)
  let busy = false;

  // --- 로그 ---
  function log(msg, cls) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = msg + "\n";
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearLog() { logEl.textContent = ""; }

  // --- 옵션 읽기 ---
  function currentFormat() {
    return document.querySelector('input[name="fmt"]:checked').value;
  }
  function formatConfig() {
    return currentFormat() === "png"
      ? { mime: "image/png", ext: ".png" }
      : { mime: "image/jpeg", ext: ".jpg" };
  }

  const qSlider = $("quality");
  qSlider.addEventListener("input", () => { $("qVal").textContent = qSlider.value; });

  // --- 확장자 판별 ---
  function isHeif(name) {
    const lower = name.toLowerCase();
    return HEIF_EXT.some((e) => lower.endsWith(e));
  }
  function swapExt(name, ext) {
    const dot = name.lastIndexOf(".");
    return (dot === -1 ? name : name.slice(0, dot)) + ext;
  }

  // --- 변환 코어: File → 목표 형식 Blob ---
  async function convertBlob(file) {
    const cfg = formatConfig();
    const opts = { blob: file, toType: cfg.mime };
    if (cfg.mime === "image/jpeg") opts.quality = Number(qSlider.value) / 100;
    const result = await heic2any(opts);
    // 다중 이미지 HEIC 는 배열을 반환할 수 있음 → 첫 이미지 사용
    return Array.isArray(result) ? result[0] : result;
  }

  // ================= 폴더 → 폴더 모드 (File System Access API) =================
  async function pickInput() {
    try {
      inputHandle = await window.showDirectoryPicker();
      $("inPath").textContent = inputHandle.name + "/";
      maybeEnableConvert();
    } catch (e) { /* 사용자가 취소 */ }
  }
  async function pickOutput() {
    try {
      outputHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      $("outPath").textContent = outputHandle.name + "/";
      maybeEnableConvert();
    } catch (e) { /* 사용자가 취소 */ }
  }

  async function* walkDir(dirHandle, recursive, prefix) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === "file") {
        yield { handle: entry, prefix: prefix };
      } else if (entry.kind === "directory" && recursive) {
        yield* walkDir(entry, recursive, prefix.concat(entry.name));
      }
    }
  }

  async function dirForPath(root, parts) {
    let dir = root;
    for (const part of parts) {
      dir = await dir.getDirectoryHandle(part, { create: true });
    }
    return dir;
  }

  async function fileExists(dir, name) {
    try { await dir.getFileHandle(name); return true; }
    catch { return false; }
  }

  async function runFolderMode() {
    const recursive = $("recursive").checked;
    const overwrite = $("overwrite").checked;
    const cfg = formatConfig();

    // 대상 파일 수집
    const targets = [];
    for await (const item of walkDir(inputHandle, recursive, [])) {
      if (isHeif(item.handle.name)) targets.push(item);
    }
    if (targets.length === 0) {
      log("변환할 HEIF/HEIC 파일을 찾지 못했습니다.", "skip");
      return;
    }
    log(`총 ${targets.length}개 파일을 ${currentFormat().toUpperCase()} 형식으로 변환합니다.\n`);
    barEl.max = targets.length; barEl.value = 0;

    let ok = 0, fail = 0;
    for (const item of targets) {
      const srcName = item.handle.name;
      const outName = swapExt(srcName, cfg.ext);
      const relLabel = item.prefix.concat(outName).join("/");
      try {
        const targetDir = await dirForPath(outputHandle, item.prefix);
        if (!overwrite && await fileExists(targetDir, outName)) {
          log("건너뜀 (이미 존재): " + relLabel, "skip");
          fail++; barEl.value++; continue;
        }
        const file = await item.handle.getFile();
        const blob = await convertBlob(file);
        const fh = await targetDir.getFileHandle(outName, { create: true });
        const writable = await fh.createWritable();
        await writable.write(blob);
        await writable.close();
        log("✓ 변환 완료: " + relLabel, "ok");
        ok++;
      } catch (err) {
        log("✗ 실패: " + relLabel + " (" + (err && err.message ? err.message : err) + ")", "err");
        fail++;
      }
      barEl.value++;
    }
    log(`\n완료: 성공 ${ok}개, 실패/건너뜀 ${fail}개`);
  }

  // ===================== 파일 선택 모드 (fallback: 다운로드) =====================
  function setupFileMode() {
    $("fileInput").addEventListener("change", (e) => {
      fileList = Array.from(e.target.files).filter((f) => isHeif(f.name));
      maybeEnableConvert();
    });
  }

  async function runFileMode() {
    const cfg = formatConfig();
    if (fileList.length === 0) {
      log("변환할 HEIF/HEIC 파일이 없습니다.", "skip");
      return;
    }
    downloadsEl.innerHTML = "";
    downloadsEl.classList.remove("hidden");
    log(`총 ${fileList.length}개 파일을 ${currentFormat().toUpperCase()} 형식으로 변환합니다.\n`);
    barEl.max = fileList.length; barEl.value = 0;

    let ok = 0, fail = 0;
    for (const file of fileList) {
      const outName = swapExt(file.name, cfg.ext);
      try {
        const blob = await convertBlob(file);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = outName; a.textContent = "⬇ " + outName;
        a.style.display = "block"; a.style.padding = "3px 0";
        downloadsEl.appendChild(a);
        log("✓ 변환 완료: " + outName, "ok");
        ok++;
      } catch (err) {
        log("✗ 실패: " + file.name + " (" + (err && err.message ? err.message : err) + ")", "err");
        fail++;
      }
      barEl.value++;
    }
    log(`\n완료: 성공 ${ok}개, 실패 ${fail}개`);
    if (ok > 0) log("위 목록의 링크를 눌러 변환된 파일을 저장하세요.", "skip");
  }

  // ===================== 공통 =====================
  function maybeEnableConvert() {
    if (busy) return;
    if (hasFS) {
      convertBtn.disabled = !(inputHandle && outputHandle);
    } else {
      convertBtn.disabled = fileList.length === 0;
    }
  }

  convertBtn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    convertBtn.disabled = true;
    const label = convertBtn.textContent;
    convertBtn.textContent = "변환 중…";
    clearLog();
    downloadsEl.classList.add("hidden");
    try {
      if (hasFS) {
        if (inputHandle && outputHandle &&
            (await inputHandle.isSameEntry(outputHandle))) {
          log("출력 폴더는 입력 폴더와 달라야 합니다.", "err");
        } else {
          await runFolderMode();
        }
      } else {
        await runFileMode();
      }
    } catch (err) {
      log("오류: " + (err && err.message ? err.message : err), "err");
    } finally {
      busy = false;
      convertBtn.textContent = label;
      maybeEnableConvert();
    }
  });

  // --- 초기화: 브라우저 능력에 따라 UI 구성 ---
  if (hasFS) {
    $("folderMode").classList.remove("hidden");
    $("pickIn").addEventListener("click", pickInput);
    $("pickOut").addEventListener("click", pickOutput);
    fsNotice.classList.add("hidden");
  } else {
    $("fileMode").classList.remove("hidden");
    $("recWrap").classList.add("hidden"); // 폴더 재귀는 fallback 에서 의미 없음
    setupFileMode();
    fsNotice.className = "notice warn";
    fsNotice.textContent =
      "이 브라우저는 폴더에 직접 저장하는 기능(File System Access API)을 지원하지 않습니다. " +
      "폴더째 자동 저장을 원하면 최신 Chrome 또는 Edge에서 열어 주세요. " +
      "지금은 파일을 선택해 변환한 뒤 링크로 내려받는 방식으로 동작합니다.";
    fsNotice.classList.remove("hidden");
  }

  // heic2any 로드 확인
  if (typeof heic2any !== "function") {
    fsNotice.className = "notice error";
    fsNotice.textContent =
      "HEIC 디코딩 라이브러리(vendor/heic2any.min.js)를 불러오지 못했습니다. " +
      "이 HTML 파일과 vendor 폴더가 같은 위치에 있는지 확인하세요.";
    fsNotice.classList.remove("hidden");
    convertBtn.disabled = true;
  }
})();
</script>
</body>
</html>
