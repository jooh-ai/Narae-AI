name: Build Windows EXE

# master_tool.py 가 바뀌어 푸시되면 윈도우용 exe 를 자동으로 빌드합니다.
# 완성된 exe 는 이 워크플로 실행 결과의 Artifacts 에서 내려받을 수 있습니다.
on:
  push:
    paths:
      - "master_tool.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name MasterTool master_tool.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterTool-windows
          path: dist/MasterTool.exe
          if-no-files-found: error
